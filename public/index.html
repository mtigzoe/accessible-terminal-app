<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>Accessible PowerShell</title>
<meta http-equiv="refresh" content="0; url=interactive_console.html">
<script>
(function () {
  try {
    var mode = localStorage.getItem('console-mode') || localStorage.getItem('terminal-console-mode') || 'accessible';
    if (mode === 'full') {
      location.replace('console.html');
      return;
    }
  } catch (e) {}
  location.replace('interactive_console.html');
})();
</script>
</head>
<body>
<p>Redirecting to the <a href="interactive_console.html">Interactive Console</a> (recommended for screen readers)…</p>
<p>Optional: <a href="console.html">Full Console (visual / advanced)</a></p>
</body>
</html>
