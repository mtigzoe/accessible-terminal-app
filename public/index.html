<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>Accessible PowerShell</title>
<meta http-equiv="refresh" content="0; url=interactive-console.html">
<script>
(function () {
  try {
    var hc = localStorage.getItem('terminal-high-contrast') === 'true';
    var fs = localStorage.getItem('terminal-font-size') || 'medium';
    document.documentElement.setAttribute('data-high-contrast', hc ? 'true' : 'false');
    document.documentElement.setAttribute('data-font-size', fs);
  } catch (e) {}
})();
</script>
</head>
<body>
<noscript>
<meta http-equiv="refresh" content="0; url=interactive-console.html">
</noscript>
<p>Redirecting to the <a href="interactive-console.html">Interactive console</a>…</p>
</body>
</html>
