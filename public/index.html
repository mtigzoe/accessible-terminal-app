<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Accessible PowerShell</title>
<script>
(function () {
  try {
    var hc = localStorage.getItem('terminal-high-contrast') === 'true';
    var fs = localStorage.getItem('terminal-font-size') || 'medium';
    document.documentElement.setAttribute('data-high-contrast', hc ? 'true' : 'false');
    document.documentElement.setAttribute('data-font-size', fs);
    if (localStorage.getItem('terminal-console-mode') === 'full') {
      window.location.replace('console.html');
    }
  } catch (e) {}
})();
</script>
<style>
:root{--bg:#0c0c0c;--panel:#161616;--text:#e6e6e6;--muted:#a0a0a0;--accent:#4fc1e9;--border:#333;--focus:#4fc1e9;--error:#f48771;--ok:#89d185}html[data-high-contrast="true"]{--bg:#000;--panel:#000;--text:#fff;--muted:#fff;--accent:#ff0;--border:#fff;--focus:#ff0;--error:#ff6b6b;--ok:#0f0}html[data-font-size="small"]{font-size:14px}html[data-font-size="medium"]{font-size:16px}html[data-font-size="large"]{font-size:18px}html[data-font-size="x-large"]{font-size:22px}*{box-sizing:border-box}body{margin:0;padding:24px;padding-top:64px;background:var(--panel);color:var(--text);font-family:"Segoe UI",system-ui,sans-serif;line-height:1.4;max-width:56rem}.app-menu{position:fixed;top:12px;left:12px;z-index:100}.menu-toggle{background:#2a2a2a;color:var(--text);border:1px solid var(--border);border-radius:4px;padding:8px 14px;cursor:pointer;font-size:.95rem;font-family:inherit}.menu-toggle:hover{border-color:var(--accent)}.menu-toggle:focus{outline:2px solid var(--focus);outline-offset:2px}.menu-toggle[aria-expanded="true"]{border-color:var(--accent)}.menu-panel{display:none;position:absolute;top:100%;left:0;min-width:12rem;background:var(--bg);border:1px solid var(--border);border-radius:6px;padding:6px 0;list-style:none;margin:4px 0 0;box-shadow:0 6px 20px rgba(0,0,0,.45)}.menu-panel[data-open="true"]{display:block}.menu-panel a{display:block;padding:8px 14px;color:var(--text);text-decoration:none;font-size:.95rem}.menu-panel a:hover,.menu-panel a:focus{background:#1e4d6b;outline:none}.panel{background:var(--bg);border:1px solid var(--border);border-radius:6px;padding:14px 16px;margin-bottom:14px}.panel h2{font-size:.85rem;font-weight:600;text-transform:uppercase;letter-spacing:.04em;color:var(--muted);margin:0 0 8px}.actions{display:flex;gap:8px;flex-wrap:wrap}button{background:#2a2a2a;color:var(--text);border:1px solid var(--border);border-radius:4px;padding:10px 14px;cursor:pointer;font-size:.95rem;font-family:inherit}button.primary{background:#1e4d6b;border-color:#2a6a90}button:hover{border-color:var(--accent)}button:focus{outline:2px solid var(--focus);outline-offset:2px}button:disabled{opacity:.55;cursor:not-allowed}.visually-hidden{position:absolute;width:1px;height:1px;padding:0;margin:-1px;overflow:hidden;clip:rect(0,0,0,0);white-space:nowrap;border:0}#path-value{font-family:Consolas,"Courier New",monospace;font-size:1.05rem;word-break:break-all;margin:0}#output{display:block;width:100%;min-height:200px;height:28vh;background:var(--bg);color:var(--text);border:1px solid var(--border);border-radius:4px;font-family:Consolas,"Courier New",monospace;line-height:1.35;padding:10px;resize:vertical;white-space:pre;overflow-wrap:normal;overflow-x:auto}#output:focus{outline:2px solid var(--focus);outline-offset:2px}.command-row{display:flex;gap:10px;align-items:flex-end;flex-wrap:wrap}.command-field{flex:1 1 16rem;min-width:0}#command{width:100%;background:var(--bg);color:var(--text);border:1px solid var(--border);border-radius:4px;font-family:Consolas,"Courier New",monospace;padding:10px 12px}#command:focus{outline:2px solid var(--focus);outline-offset:2px;border-color:var(--focus)}#nlsh-progress[hidden],#structured-panel[hidden],#editor-panel[hidden]{display:none}#nlsh-progress{margin-top:12px}#nlsh-progress-text{margin:0 0 8px;color:var(--muted);font-size:.95rem}#nlsh-progress-row{display:flex;align-items:center;gap:12px}#nlsh-progress-row progress{flex:1}#nlsh-progress-percent{font-variant-numeric:tabular-nums;font-weight:600;min-width:3.25rem;text-align:right;color:var(--accent)}#structured-content{margin:0}#structured-content h3{font-size:1.05rem;font-weight:600;margin:0 0 10px;color:var(--text)}#structured-content .summary{margin:0 0 12px;color:var(--muted)}#structured-content ul{list-style:none;margin:0 0 12px;padding:0}#structured-content li{border:1px solid var(--border);border-radius:4px;padding:10px 12px;margin-bottom:8px}#structured-content li.current{border-color:var(--accent)}#structured-content .item-title{font-weight:600;margin:0 0 4px}#structured-content .item-meta{color:var(--muted);font-size:.9rem;margin:0 0 8px}#structured-content .item-actions,#structured-content .global-actions{display:flex;flex-wrap:wrap;gap:8px}#structured-content button.danger{border-color:var(--error);color:var(--error)}#structured-content .empty-note{color:var(--muted);margin:0}#editor-status{margin:0 0 10px;color:var(--muted)}#editor-textarea{display:block;width:100%;min-height:200px;height:32vh;background:var(--bg);color:var(--text);border:1px solid var(--border);border-radius:4px;font-family:Consolas,"Courier New",monospace;line-height:1.35;padding:10px;resize:vertical;white-space:pre;overflow-wrap:normal;overflow-x:auto;margin-bottom:10px}#editor-textarea:focus{outline:2px solid var(--focus);outline-offset:2px}
</style>
</head>
<body>
<nav class="app-menu" aria-label="Main menu"><button type="button" class="menu-toggle" id="menu-toggle" aria-expanded="false" aria-controls="menu-panel" aria-haspopup="menu">Menu</button><ul class="menu-panel" id="menu-panel" role="menu" data-open="false"><li role="none"><a role="menuitem" href="instructions.html" tabindex="-1">Instructions</a></li><li role="none"><a role="menuitem" href="console.html" tabindex="-1">Full console</a></li><li role="none"><a role="menuitem" href="settings.html" tabindex="-1">Settings</a></li></ul></nav>
<main>
<section class="panel" aria-labelledby="path-heading"><h2 id="path-heading">Current path</h2><p id="path-value" aria-live="polite">Waiting for shell…</p></section>
<section class="panel" id="structured-panel" hidden aria-labelledby="structured-heading"><h2 id="structured-heading">Structured results</h2><div id="structured-content"></div></section>
<section class="panel" id="editor-panel" hidden aria-labelledby="editor-heading"><h2 id="editor-heading">File editor</h2><p id="editor-status" aria-live="polite"></p><label for="editor-textarea" class="visually-hidden">File contents</label><textarea id="editor-textarea" spellcheck="false"></textarea><div class="actions"><button type="button" id="editor-save-btn" class="primary">Save (Ctrl+S)</button><button type="button" id="editor-cancel-btn">Cancel (Escape)</button></div></section>
<section class="panel" aria-labelledby="output-heading"><h2 id="output-heading">Output</h2><textarea id="output" readonly spellcheck="false" aria-label="Command output, read-only"></textarea></section>
<section class="panel"><form id="command-form" class="command-row"><div class="command-field"><input type="text" id="command" name="command" autocomplete="off" spellcheck="false" aria-label="Command" disabled></div><div class="actions"><button type="submit" id="run-btn" class="primary" disabled>Run</button><button type="button" id="stop-btn" disabled>Stop</button><button type="button" id="clear-btn" disabled>Clear output</button></div></form><div id="nlsh-progress" hidden role="status" aria-live="polite" aria-busy="false" aria-labelledby="nlsh-progress-text"><p id="nlsh-progress-text"></p><div id="nlsh-progress-row"><progress id="nlsh-progress-bar" max="100" value="0" aria-label="Translation progress"></progress><span id="nlsh-progress-percent" aria-hidden="true">0%</span></div></div></section>
</main><div id="sr-status" class="visually-hidden" role="status" aria-live="polite" aria-atomic="true"></div><div id="sr-alert" class="visually-hidden" role="alert" aria-live="assertive" aria-atomic="true"></div><script src="app-shell.js"></script>
</body></html>
