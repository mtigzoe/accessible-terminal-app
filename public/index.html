<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Accessible PowerShell</title>
<script>
(function () {
  try {
    var hc = localStorage.getItem('terminal-high-contrast') === 'true';
    var fs = localStorage.getItem('terminal-font-size') || 'medium';
    document.documentElement.setAttribute('data-high-contrast', hc ? 'true' : 'false');
    document.documentElement.setAttribute('data-font-size', fs);
  } catch (e) {}
})();
</script>
<style>
:root{--bg:#0c0c0c;--text:#e6e6e6;--accent:#4fc1e9;--border:#333;--focus:#4fc1e9}html[data-high-contrast="true"]{--bg:#000;--text:#fff;--accent:#ff0;--border:#fff;--focus:#ff0}html[data-font-size="small"]{font-size:14px}html[data-font-size="medium"]{font-size:16px}html[data-font-size="large"]{font-size:18px}html[data-font-size="x-large"]{font-size:22px}*{box-sizing:border-box}body{margin:0;padding:24px;background:var(--bg);color:var(--text);font-family:"Segoe UI",system-ui,sans-serif;line-height:1.4}.app-menu{position:relative}.menu-toggle{background:#2a2a2a;color:var(--text);border:1px solid var(--border);border-radius:4px;padding:8px 14px;cursor:pointer;font-size:.95rem;font-family:inherit}.menu-toggle:focus{outline:2px solid var(--focus);outline-offset:2px}.menu-toggle[aria-expanded="true"]{border-color:var(--accent)}.menu-panel{display:none;position:absolute;top:100%;left:0;min-width:12rem;background:var(--bg);border:1px solid var(--border);border-radius:6px;padding:6px 0;list-style:none;margin:4px 0 0}.menu-panel[data-open="true"]{display:block}.menu-panel a{display:block;padding:8px 14px;color:var(--text);text-decoration:none}.menu-panel a:hover,.menu-panel a:focus{background:#1e4d6b;outline:none}.visually-hidden{position:absolute;width:1px;height:1px;padding:0;margin:-1px;overflow:hidden;clip:rect(0,0,0,0);white-space:nowrap;border:0}
</style>
</head>
<body>
<nav class="app-menu" aria-label="Main menu navigation"><button type="button" class="menu-toggle" id="menu-toggle" aria-expanded="false" aria-controls="menu-panel" aria-haspopup="menu">Menu</button><ul class="menu-panel" id="menu-panel" role="menu" data-open="false"><li role="none"><a role="menuitem" href="instructions.html" tabindex="-1">Instructions</a></li><li role="none"><a role="menuitem" href="console.html" tabindex="-1">Full console</a></li><li role="none"><a role="menuitem" href="settings.html" tabindex="-1">Settings</a></li></ul></nav>
<script>
(function(){
  const menuToggle=document.getElementById('menu-toggle');
  const menuPanel=document.getElementById('menu-panel');
  const menuItems=Array.from(menuPanel.querySelectorAll('[role="menuitem"]'));
  function openMenu(index){menuToggle.setAttribute('aria-expanded','true');menuPanel.dataset.open='true';(menuItems[index]||menuItems[0]).focus()}
  function closeMenu(){menuToggle.setAttribute('aria-expanded','false');menuPanel.dataset.open='false';menuToggle.focus()}
  menuToggle.addEventListener('click',()=>menuPanel.dataset.open==='true'?closeMenu():openMenu(0));
  menuToggle.addEventListener('keydown',e=>{if(e.key==='ArrowDown'||e.key==='Enter'||e.key===' '){e.preventDefault();openMenu(0)}else if(e.key==='ArrowUp'){e.preventDefault();openMenu(menuItems.length-1)}});
  menuPanel.addEventListener('keydown',e=>{const i=menuItems.indexOf(document.activeElement);if(e.key==='ArrowDown'){e.preventDefault();openMenu((i+1)%menuItems.length)}else if(e.key==='ArrowUp'){e.preventDefault();openMenu((i-1+menuItems.length)%menuItems.length)}else if(e.key==='Home'){e.preventDefault();openMenu(0)}else if(e.key==='End'){e.preventDefault();openMenu(menuItems.length-1)}else if(e.key==='Escape'){e.preventDefault();closeMenu()}else if(e.key==='Tab'){menuToggle.setAttribute('aria-expanded','false');menuPanel.dataset.open='false'}});
  document.addEventListener('click',e=>{if(!menuToggle.contains(e.target)&&!menuPanel.contains(e.target)){menuToggle.setAttribute('aria-expanded','false');menuPanel.dataset.open='false'}});
  document.addEventListener('keydown',e=>{if(e.key==='Escape'&&menuPanel.dataset.open==='true'){e.preventDefault();closeMenu()}});
})();
</script>
</body>
</html>
