<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Full console — Accessible PowerShell</title>
<link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/@xterm/xterm@5.5.0/css/xterm.css">
<script src="https://cdn.jsdelivr.net/npm/@xterm/xterm@5.5.0/lib/xterm.js"></script>
<script src="https://cdn.jsdelivr.net/npm/@xterm/addon-fit@0.10.0/lib/addon-fit.js"></script>
<style>
  :root {
    --bg: #0c0c0c;
    --panel: #161616;
    --text: #e6e6e6;
    --muted: #a0a0a0;
    --accent: #4fc1e9;
    --border: #333;
    --focus: #4fc1e9;
  }
  * { box-sizing: border-box; }
  body {
    margin: 0;
    padding: 12px;
    padding-top: 56px;
    background: var(--panel);
    color: var(--text);
    font-family: "Segoe UI", system-ui, sans-serif;
    height: 100vh;
  }
  .app-menu {
    position: fixed;
    top: 12px;
    left: 12px;
    z-index: 100;
  }
  .menu-toggle {
    background: #2a2a2a;
    color: var(--text);
    border: 1px solid var(--border);
    border-radius: 4px;
    padding: 8px 14px;
    cursor: pointer;
    font-size: 0.95rem;
    font-family: inherit;
  }
  .menu-toggle:focus {
    outline: 2px solid var(--focus);
    outline-offset: 2px;
  }
  .menu-panel {
    display: none;
    position: absolute;
    top: 100%;
    left: 0;
    margin: 4px 0 0;
    min-width: 12rem;
    background: var(--bg);
    border: 1px solid var(--border);
    border-radius: 6px;
    padding: 6px 0;
    list-style: none;
    box-shadow: 0 6px 20px rgba(0,0,0,0.45);
  }
  .menu-panel[data-open="true"] { display: block; }
  .menu-panel a {
    display: block;
    padding: 8px 14px;
    color: var(--text);
    text-decoration: none;
  }
  .menu-panel a:hover, .menu-panel a:focus {
    background: #1e4d6b;
    outline: none;
  }
  .toolbar {
    display: flex;
    flex-wrap: wrap;
    gap: 10px;
    align-items: center;
    margin-bottom: 8px;
  }
  .toolbar p {
    margin: 0;
    color: var(--muted);
    font-size: 0.9rem;
  }
  .toolbar a { color: var(--accent); }
  #xterm-wrap {
    height: calc(100vh - 100px);
    background: #000;
    border: 1px solid var(--border);
    border-radius: 6px;
    padding: 4px;
  }
  #xterm-wrap .xterm { height: 100%; padding: 4px; }
  .visually-hidden {
    position: absolute;
    width: 1px;
    height: 1px;
    overflow: hidden;
    clip: rect(0,0,0,0);
  }
</style>
</head>
<body>
  <nav class="app-menu" aria-label="Main menu">
    <button type="button" class="menu-toggle" id="menu-toggle"
      aria-expanded="false" aria-controls="menu-panel" aria-haspopup="menu">Menu</button>
    <ul class="menu-panel" id="menu-panel" role="menu" data-open="false">
      <li role="none"><a role="menuitem" href="index.html" tabindex="-1">Accessible terminal</a></li>
      <li role="none"><a role="menuitem" href="console.html" aria-current="page" tabindex="-1">Full console</a></li>
      <li role="none"><a role="menuitem" href="instructions.html" tabindex="-1">Instructions</a></li>
      <li role="none"><a role="menuitem" href="settings.html" tabindex="-1">Settings</a></li>
    </ul>
  </nav>

  <div class="toolbar">
    <p>Full console (xterm). Every key goes to the shell. Prefer Accessible terminal with a screen reader.</p>
    <a href="settings.html">Settings</a>
    <a href="index.html">Accessible terminal</a>
  </div>

  <div id="xterm-wrap" role="region" aria-label="Full terminal console">
    <div id="terminal"></div>
  </div>
  <div id="sr-status" class="visually-hidden" role="status" aria-live="polite"></div>

<script>
(function () {
  const menuToggle = document.getElementById('menu-toggle');
  const menuPanel = document.getElementById('menu-panel');
  const menuItems = Array.prototype.slice.call(menuPanel.querySelectorAll('[role="menuitem"]'));

  function isMenuOpen() {
    return menuToggle.getAttribute('aria-expanded') === 'true';
  }
  function setMenuOpen(open, focusItemIndex) {
    menuToggle.setAttribute('aria-expanded', open ? 'true' : 'false');
    menuPanel.dataset.open = open ? 'true' : 'false';
    if (open && menuItems[focusItemIndex || 0]) menuItems[focusItemIndex || 0].focus();
    else menuToggle.focus();
  }
  function focusMenuItem(index) {
    const n = menuItems.length;
    menuItems[((index % n) + n) % n].focus();
  }
  menuToggle.addEventListener('click', function () {
    setMenuOpen(!isMenuOpen(), 0);
  });
  menuToggle.addEventListener('keydown', function (e) {
    if (e.key === 'ArrowDown' || e.key === 'Enter' || e.key === ' ') {
      e.preventDefault();
      setMenuOpen(true, 0);
    }
  });
  menuPanel.addEventListener('keydown', function (e) {
    if (!isMenuOpen()) return;
    const idx = menuItems.indexOf(document.activeElement);
    if (e.key === 'ArrowDown') { e.preventDefault(); focusMenuItem(idx + 1); }
    else if (e.key === 'ArrowUp') { e.preventDefault(); focusMenuItem(idx - 1); }
    else if (e.key === 'Escape') { e.preventDefault(); setMenuOpen(false); }
    else if (e.key === 'Tab') setMenuOpen(false);
  });
  document.addEventListener('click', function (e) {
    if (!menuToggle.contains(e.target) && !menuPanel.contains(e.target) && isMenuOpen()) {
      menuToggle.setAttribute('aria-expanded', 'false');
      menuPanel.dataset.open = 'false';
    }
  });

  const sr = document.getElementById('sr-status');
  function announce(t) {
    sr.textContent = '';
    setTimeout(function () { sr.textContent = t; }, 80);
  }

  if (typeof Terminal === 'undefined') {
    announce('Could not load xterm.js. Check your network or use Accessible terminal.');
    return;
  }

  const term = new Terminal({
    cursorBlink: true,
    fontFamily: 'Consolas, "Courier New", monospace',
    fontSize: 14,
    theme: { background: '#000000', foreground: '#e6e6e6', cursor: '#e6e6e6' },
    screenReaderMode: true,
    convertEol: true
  });

  var FitCtor = null;
  if (typeof FitAddon !== 'undefined') {
    FitCtor = FitAddon.FitAddon || FitAddon;
  }
  const fitAddon = FitCtor ? new FitCtor() : null;
  if (fitAddon) term.loadAddon(fitAddon);
  term.open(document.getElementById('terminal'));
  if (fitAddon) { try { fitAddon.fit(); } catch (e) {} }

  const protocol = location.protocol === 'https:' ? 'wss://' : 'ws://';
  const socket = new WebSocket(protocol + location.host + '/ws');

  function sendResize() {
    if (!fitAddon || socket.readyState !== WebSocket.OPEN) return;
    try { fitAddon.fit(); } catch (e) {}
    socket.send(JSON.stringify({ type: 'resize', cols: term.cols, rows: term.rows }));
  }

  socket.addEventListener('open', function () {
    try {
      var saved = localStorage.getItem('terminal-last-path');
      if (saved && saved.trim()) {
        socket.send(JSON.stringify({ type: 'cwd', cwd: saved.trim() }));
      }
    } catch (e) {}
    sendResize();
    announce('Full console connected.');
    term.focus();
  });
  socket.addEventListener('message', function (ev) {
    term.write(typeof ev.data === 'string' ? ev.data : String(ev.data));
  });
  socket.addEventListener('close', function () {
    term.writeln('\r\n[connection closed]');
    announce('Connection closed.');
  });
  term.onData(function (data) {
    if (socket.readyState === WebSocket.OPEN) socket.send(data);
  });
  window.addEventListener('resize', sendResize);

  try { localStorage.setItem('terminal-console-mode', 'full'); } catch (e) {}
})();
</script>
</body>
</html>
