<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1">
<title>Full Console — Accessible Terminal</title>
<link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/@xterm/xterm@5.5.0/css/xterm.css">
<script src="https://cdn.jsdelivr.net/npm/@xterm/xterm@5.5.0/lib/xterm.js"></script>
<script src="https://cdn.jsdelivr.net/npm/@xterm/addon-fit@0.10.0/lib/addon-fit.js"></script>
<style>
:root{--bg:#0c0c0c;--panel:#161616;--text:#e6e6e6;--muted:#aaa;--accent:#4fc1e9;--border:#444;--focus:#4fc1e9}*{box-sizing:border-box}body{margin:0;padding:12px;padding-top:56px;background:var(--panel);color:var(--text);font-family:"Segoe UI",system-ui,sans-serif;height:100vh}.app-menu{position:fixed;top:12px;left:12px;z-index:100}.menu-toggle,button{background:#2a2a2a;color:var(--text);border:1px solid var(--border);border-radius:4px;padding:8px 12px;font:inherit;cursor:pointer}.menu-toggle:focus,button:focus,a:focus{outline:2px solid var(--focus);outline-offset:2px}.menu-panel{display:none;position:absolute;top:100%;left:0;background:var(--bg);border:1px solid var(--border);padding:6px;min-width:14rem;list-style:none}.menu-panel[data-open=true]{display:block}.menu-panel a{display:block;padding:8px 12px;color:var(--text);text-decoration:none}.toolbar{display:flex;gap:8px;flex-wrap:wrap;align-items:center;margin-bottom:8px}.toolbar .status{color:var(--muted);flex:1}.primary{background:#1e4d6b}.visually-hidden{position:absolute;width:1px;height:1px;padding:0;margin:-1px;overflow:hidden;clip:rect(0,0,0,0);white-space:nowrap;border:0}#terminal{height:calc(100vh - 108px);background:#000;border:1px solid var(--border);border-radius:6px;padding:4px}#accessible-buffer[hidden]{display:none}#accessible-buffer{position:fixed;inset:0;z-index:200;background:rgba(0,0,0,.9);padding:20px}#accessible-buffer .panel{height:100%;display:flex;flex-direction:column;background:var(--bg);border:1px solid var(--border);padding:14px;border-radius:6px}#buffer-text{flex:1;width:100%;resize:none;background:#000;color:var(--text);border:1px solid var(--border);padding:10px;font:16px/1.4 Consolas,"Courier New",monospace}#buffer-text:focus{outline:2px solid var(--focus);outline-offset:2px}
</style>
</head>
<body>
<nav class="app-menu" aria-label="Main menu"><button id="menu-toggle" type="button" aria-expanded="false">Menu</button><ul id="menu-panel" class="menu-panel"><li><a href="index.html">Accessible terminal</a></li><li><a href="console.html" aria-current="page">Full Console</a></li><li><a href="instructions.html">Instructions</a></li><li><a href="settings.html">Settings</a></li></ul></nav>
<div class="toolbar"><button id="open-buffer" type="button">Open accessible buffer</button><button id="refresh-buffer" type="button">Refresh buffer</button><button id="send-enter" type="button">Send Enter</button><button id="send-ctrl-c" type="button">Send Ctrl+C</button><button id="clear" type="button">Clear screen</button><button id="accessible-mode" type="button">Switch to Accessible Console</button><span id="status" class="status" role="status" aria-live="polite">Connecting…</span></div>
<div id="terminal" aria-label="Full xterm.js terminal"></div>
<div id="accessible-buffer" hidden><div class="panel"><h1>Accessible terminal buffer</h1><p id="buffer-help">The current xterm.js buffer is copied into this text area. Use your screen reader or Braille display to read it. Escape closes this view.</p><textarea id="buffer-text" aria-describedby="buffer-help" spellcheck="false" readonly></textarea><div class="toolbar"><button id="buffer-prev" type="button">Previous line</button><button id="buffer-next" type="button">Next line</button><button id="buffer-close" type="button">Close buffer</button></div></div></div>
<div id="sr-status" class="visually-hidden" role="status" aria-live="polite" aria-atomic="true"></div><div id="sr-alert" class="visually-hidden" role="alert" aria-live="assertive" aria-atomic="true"></div>
<script>
(function(){
const status=document.getElementById('status'),sr=document.getElementById('sr-status'),alertBox=document.getElementById('sr-alert'),buffer=document.getElementById('accessible-buffer'),bufferText=document.getElementById('buffer-text');let socket=null,term=null,fit=null;
function announce(text,urgent){const target=urgent?alertBox:sr;target.textContent='';setTimeout(()=>target.textContent=text,40)}
function capture(){if(!term)return '';const b=term.buffer.active,lines=[];for(let i=0;i<b.length;i++){const line=b.getLine(i);lines.push(line?line.translateToString(true):'')}while(lines.length&&lines[lines.length-1]==='')lines.pop();return lines.join('\n')}
function openBuffer(){const text=capture();bufferText.value=text||'(Buffer is empty.)';buffer.hidden=false;bufferText.focus();announce('Accessible buffer open. '+(text?text.split('\n').length:0)+' lines. Escape closes this view.')}
function closeBuffer(){buffer.hidden=true;term.focus();announce('Returned to full console.')}
function connect(){const protocol=location.protocol==='https:'?'wss://':'ws://';socket=new WebSocket(protocol+location.host+'/ws');socket.addEventListener('open',()=>{status.textContent='Connected to PowerShell PTY.';let cwd='';try{cwd=localStorage.getItem('terminal-last-path')||''}catch(e){}socket.send(JSON.stringify({type:'cwd',cwd,mode:'full'}));announce('Full Console connected. xterm.js is ready.');term.focus()});socket.addEventListener('message',e=>{const text=typeof e.data==='string'?e.data:String(e.data);if(text.startsWith('{')){try{const msg=JSON.parse(text);if(msg.type==='history'&&typeof msg.data==='string'){term.write(msg.data);return}}catch(err){}}term.write(text)});socket.addEventListener('close',()=>{status.textContent='Terminal connection closed.';announce('Terminal connection closed.',true)});socket.addEventListener('error',()=>{status.textContent='Could not connect to the terminal.';announce('Could not connect to the terminal.',true)})}
function send(data){if(socket&&socket.readyState===WebSocket.OPEN){socket.send(data);return true}announce('Terminal is not connected.',true);return false}
function moveBuffer(direction){const lines=bufferText.value.split('\n');if(!lines.length)return;const pos=bufferText.selectionStart||0;let line=bufferText.value.slice(0,pos).split('\n').length-1;line=Math.max(0,Math.min(lines.length-1,line+direction));let offset=0;for(let i=0;i<line;i++)offset+=lines[i].length+1;bufferText.focus();bufferText.setSelectionRange(offset,offset+lines[line].length);announce('Line '+(line+1)+' of '+lines.length+': '+(lines[line]||'(empty line)'))}
function init(){if(typeof Terminal==='undefined'){status.textContent='xterm.js could not be loaded.';announce('xterm.js could not be loaded. Check your network connection.',true);return}let srMode=false;try{srMode=localStorage.getItem('terminal-sr-mode')==='true'}catch(e){}term=new Terminal({cursorBlink:true,convertEol:true,scrollback:5000,fontFamily:'Consolas, "Courier New", monospace',fontSize:14,screenReaderMode:srMode,theme:{background:'#000000',foreground:'#e6e6e6',cursor:'#e6e6e6'}});const FitCtor=window.FitAddon&&(window.FitAddon.FitAddon||window.FitAddon);if(FitCtor){fit=new FitCtor();term.loadAddon(fit)}term.open(document.getElementById('terminal'));if(fit)try{fit.fit()}catch(e){}term.onData(data=>send(data));window.addEventListener('resize',()=>{if(fit)try{fit.fit()}catch(e){}});connect()}
document.getElementById('open-buffer').onclick=openBuffer;document.getElementById('refresh-buffer').onclick=()=>{if(!buffer.hidden)openBuffer();else announce('Open accessible buffer first.')};document.getElementById('buffer-close').onclick=closeBuffer;document.getElementById('send-enter').onclick=()=>{send('\r');term.focus();announce('Enter sent.')};document.getElementById('send-ctrl-c').onclick=()=>{send('\x03');term.focus();announce('Ctrl+C sent.')};document.getElementById('clear').onclick=()=>{term.clear();announce('Terminal screen cleared.')};document.getElementById('accessible-mode').onclick=()=>{try{localStorage.setItem('console-mode','accessible')}catch(e){};location.href='index.html'};document.getElementById('buffer-prev').onclick=()=>moveBuffer(-1);document.getElementById('buffer-next').onclick=()=>moveBuffer(1);document.getElementById('menu-toggle').onclick=()=>{const t=document.getElementById('menu-toggle'),p=document.getElementById('menu-panel'),open=t.getAttribute('aria-expanded')!=='true';t.setAttribute('aria-expanded',String(open));p.dataset.open=String(open);if(open)p.querySelector('a').focus()};document.addEventListener('keydown',e=>{if(!buffer.hidden&&e.key==='Escape'){e.preventDefault();closeBuffer()}});init();
})();
</script>
</body></html>
